name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone:
    name: Standalone CMake (${{ matrix.compiler }}, sanitizers)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build
      - name: Configure
        run: >
          cmake -S vda5050_core -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DVDA5050_CORE_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure fault_core
        run: >
          cmake -S fault_core -B build_fault -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DFAULT_CORE_SANITIZE=ON
      - name: Build fault_core
        run: cmake --build build_fault
      - name: Test fault_core
        run: ctest --test-dir build_fault --output-on-failure
      - name: Configure fleet_core
        run: >
          cmake -S fleet_core -B build_fleet -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DFLEET_CORE_SANITIZE=ON
      - name: Build fleet_core
        run: cmake --build build_fleet
      - name: Test fleet_core (planner, fleet manager, simulated fleets)
        run: ctest --test-dir build_fleet --output-on-failure --timeout 900

  ros2:
    name: ROS 2 Jazzy (colcon)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/vda5050_bridge
      - name: Install dependencies
        run: |
          apt-get update
          # libmosquitto has no rosdep key, so it is installed directly.
          apt-get install -y libmosquitto-dev
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
      - name: Integration test (real broker, fake Nav2)
        shell: bash
        run: |
          apt-get install -y mosquitto mosquitto-clients
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          bash src/vda5050_bridge/vda5050_nav2_adapter/test/integration_test.sh
      - name: Fault management system test (fault manager, adapter, web API, rosbag2)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 src/vda5050_bridge/fault_manager/test/fault_system_test.py

  nav2-simulation:
    name: Real Nav2 with simulated robot
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/vda5050_bridge
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libmosquitto-dev mosquitto mosquitto-clients \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-nav2-loopback-sim
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
      - name: Show available Nav2 launch files
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          ls "$(ros2 pkg prefix nav2_bringup)/share/nav2_bringup/launch"
      - name: Drive orders through Nav2
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          bash src/vda5050_bridge/vda5050_nav2_adapter/test/nav2_simulation_test.sh

  gazebo-simulation:
    name: Real Nav2 with Gazebo (lidar, AMCL, obstacles)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/vda5050_bridge
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libmosquitto-dev mosquitto mosquitto-clients \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-nav2-minimal-tb3-sim \
            xvfb mesa-utils libgl1-mesa-dri libegl1
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build
      - name: Drive orders through Nav2 in Gazebo
        shell: bash
        env:
          SIMULATOR: gazebo
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          bash src/vda5050_bridge/vda5050_nav2_adapter/test/nav2_simulation_test.sh

  fleet-system:
    name: Fleet manager with four vehicle processes and a real broker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          ninja-build libmosquitto-dev mosquitto mosquitto-clients
      - name: Build the fleet manager and the simulated vehicle
        run: |
          cmake -S vda5050_fleet -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build
      - name: Run tasks through the fleet (cancel one, kill a vehicle, bring it back)
        run: >
          python3 vda5050_fleet/test/fleet_system_test.py build
          vda5050_fleet/config/demo_roadmap.json

  schema-conformance:
    name: Official VDA 5050 JSON schemas (2.0.0 and 2.1.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-jsonschema
      - name: Fetch the official schemas at fixed versions
        run: |
          git clone --depth 1 --branch 2.0.0 https://github.com/VDA5050/VDA5050 schemas-2.0.0
          git clone --depth 1 --branch 2.1.0 https://github.com/VDA5050/VDA5050 schemas-2.1.0
      - name: Build
        run: |
          cmake -S vda5050_core -B build -G Ninja -DBUILD_TESTING=OFF
          cmake --build build --target emit_samples
      - name: Validate
        run: >
          bash vda5050_core/test/run_schema_conformance.sh build/emit_samples
          schemas-2.0.0/json_schemas schemas-2.1.0/json_schemas

  coverage:
    name: Test coverage of vda5050_core, fault_core and fleet_core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build gcovr
      - name: Build with coverage instrumentation
        run: |
          cmake -S vda5050_core -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage -O0"
          cmake --build build
      - name: Run the unit tests
        run: ./build/vda5050_core_tests
      - name: Report (fails below 95 % line coverage)
        run: >
          gcovr --root . --filter 'vda5050_core/src/'
          --print-summary --fail-under-line 95
          build/CMakeFiles/vda5050_core.dir
      - name: Build fault_core with coverage instrumentation
        run: |
          cmake -S fault_core -B build_fault -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage -O0"
          cmake --build build_fault
      - name: Run the fault_core unit tests
        run: ./build_fault/fault_core_tests
      - name: Report for fault_core (fails below 95 % line coverage)
        run: >
          gcovr --root . --filter 'fault_core/src/'
          --print-summary --fail-under-line 95
          build_fault/CMakeFiles/fault_core.dir
      - name: Build fleet_core with coverage instrumentation
        run: |
          cmake -S fleet_core -B build_fleet -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage -O0"
          cmake --build build_fleet
      - name: Run the fleet_core unit tests
        run: ./build_fleet/fleet_core_tests
      - name: Report for fleet_core (fails below 95 % line coverage)
        run: >
          gcovr --root . --filter 'fleet_core/src/'
          --print-summary --fail-under-line 95
          build_fleet/CMakeFiles/fleet_core.dir

  fuzz:
    name: Fuzz the JSON parser and decoders (60 s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang with libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev
      - name: Build the fuzz target
        run: >
          clang++ -std=c++17 -g -O1 -fsanitize=fuzzer,address,undefined
          -fno-sanitize-recover=undefined
          -Ivda5050_core/include vda5050_core/fuzz/fuzz_decoder.cpp vda5050_core/src/*.cpp
          -o fuzz_decoder
      - name: Fuzz
        run: |
          mkdir corpus && cp vda5050_core/test/data/*.json corpus/
          ./fuzz_decoder -max_total_time=60 -max_len=8192 -print_final_stats=1 corpus

