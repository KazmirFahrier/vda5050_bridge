name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone:
    name: Standalone CMake (${{ matrix.compiler }}, sanitizers)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build
      - name: Configure
        run: >
          cmake -S vda5050_core -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DVDA5050_CORE_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ros2:
    name: ROS 2 Jazzy (colcon)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/vda5050_bridge
      - name: Install dependencies
        run: |
          apt-get update
          # libmosquitto has no rosdep key, so it is installed directly.
          apt-get install -y libmosquitto-dev
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
      - name: Integration test (real broker, fake Nav2)
        shell: bash
        run: |
          apt-get install -y mosquitto mosquitto-clients
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          bash src/vda5050_bridge/vda5050_nav2_adapter/test/integration_test.sh
